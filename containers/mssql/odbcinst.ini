; odbcinst.ini — registrazione driver Microsoft ODBC 18 per SQL Server
; Copiato in /etc/odbcinst.ini dallo stage `mssql` del Containerfile.
;
; NOTA: il nome del .so cambia con la patch release (18.6, 18.6.2, ...:
; verificato `libmsodbcsql-18.6.so.2.1` con msodbcsql18-18.6.2.1).
; Il Containerfile, dopo `microdnf install msodbcsql18`, riallinea
; automaticamente la riga Driver al file reale presente in
; /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.*.so.*.
; Se si ispeziona l'immagine, verificare con: odbcinst -q -d -v

[msodbcsql18]
Description = Microsoft ODBC Driver 18 for SQL Server
Driver = /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18.6.so.2.1
UsageCount = 1
